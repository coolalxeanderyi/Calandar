<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>計劃版</title>
  <meta name="description" content="任務、行事曆、目標和習慣，整理在同一個地方，手機和電腦同步。">
  <meta name="theme-color" content="#FFF6F3">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="計劃版">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // 先套用上次使用的配色主題和深淺模式，避免畫面閃一下
    (function () {
      try {
        var root = document.documentElement;
        var t = localStorage.getItem('planner.v1.theme') || 'auto';
        var dark = t === 'dark' || (t === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        root.dataset.theme = dark ? 'dark' : 'light';
        var look = JSON.parse(localStorage.getItem('planner.v3.look') || 'null');
        var vars = look && (dark ? look.dark : look.light);
        if (vars) {
          root.dataset.palette = look.palette;
          for (var k in vars) if (/^--[a-z0-9-]+$/.test(k)) root.style.setProperty(k, vars[k]);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta && vars['--bg']) meta.setAttribute('content', vars['--bg']);
        }
      } catch (e) {}
    })();
  </script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="app"><p class="boot">載入中…</p></div>
  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root"></div>
  <noscript><p class="boot">這個網站需要開啟 JavaScript 才能使用。</p></noscript>
</body>
</html>
